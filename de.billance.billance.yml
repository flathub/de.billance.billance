app-id: de.billance.billance
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: billance
separate-locales: false

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --env=ELECTRON_TRASH=gio
  # Invoices are written to the user's Documents folder so they stay visible on
  # the host and can be opened/revealed in the file manager.
  - --filesystem=xdg-documents
  # "Show invoice in file manager": shell.showItemInFolder() calls
  # org.freedesktop.FileManager1.ShowItems on the session bus.
  - --talk-name=org.freedesktop.FileManager1

modules:
  - name: billance
    buildsystem: simple
    build-commands:
      - mkdir -p /app/main
      - cp -a app/. /app/main
      - patch-electron-desktop-filename /app/main/resources/app.asar --desktop-filename de.billance.billance.desktop
      - install -Dm755 billance-wrapper.sh /app/bin/billance
      - install -Dm644 app/de.billance.billance.desktop /app/share/applications/de.billance.billance.desktop
      # The metainfo is installed from a standalone repo file (not the tarball
      # copy) so description updates don't require re-publishing the tarballs.
      - install -Dm644 de.billance.billance.metainfo.xml /app/share/metainfo/de.billance.billance.metainfo.xml
      - install -Dm644 app/de.billance.billance.svg /app/share/icons/hicolor/scalable/apps/de.billance.billance.svg
      - install -Dm644 app/LICENSE.proprietary.txt /app/share/licenses/de.billance.billance/LICENSE.proprietary.txt
    sources:
      - type: archive
        url: https://billance.de/downloads/flatpak/2026.2.0/Billance-2026.2.0-linux-x86_64-flatpak-extra-data.tar.gz
        sha256: 335a4732d52551ceab05f2a96ec891854777d5326259fe54a24b05bae4544001
        dest: app
        strip-components: 0
        only-arches:
          - x86_64
      - type: archive
        url: https://billance.de/downloads/flatpak/2026.2.0/Billance-2026.2.0-linux-aarch64-flatpak-extra-data.tar.gz
        sha256: 8b2df1462317d865b32a79a46e1bab04a1c8eab8f2e9163e6b30ce38ab1002eb
        dest: app
        strip-components: 0
        only-arches:
          - aarch64
      - type: file
        path: billance-wrapper.sh
      - type: file
        path: de.billance.billance.metainfo.xml
